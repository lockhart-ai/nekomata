name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# needed so the tagged-release step can create a release + upload the .vsix
permissions:
  contents: write

jobs:
  vsix:
    # The extension runtime is macOS-only, but packaging a .vsix is just
    # Node + a Python syntax check — so it builds fine (and faster) on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sanity-check the server, page, and extension
        run: |
          python3 -c "import ast; ast.parse(open('fleet_dashboard.py').read())"
          node --check web/app.js
          node --check web/glade.js
          node --check extension/extension.js

      - name: Test the Glade adapter and plugin build
        run: node --test

      - name: Build the .vsix
        run: bash build.sh

      - name: Build the Glade plugin
        run: bash build.sh glade

      - name: Upload the Glade plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekomata-glade-plugin
          path: dist/glade/

      - name: Upload the .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekomata-vsix
          path: nekomata.vsix

      - name: Attach the .vsix to tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nekomata.vsix
          generate_release_notes: true
