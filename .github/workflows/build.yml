name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  vsix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sanity-check the server and extension
        run: |
          python3 -c "import ast; ast.parse(open('fleet_dashboard.py').read())"
          node --check extension/extension.js

      - name: Build the .vsix
        run: bash build.sh

      - name: Upload the .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekomata-vsix
          path: nekomata.vsix

      - name: Attach the .vsix to tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nekomata.vsix
